<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Учёт оплаты обучения{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="{{ url_for('views.students') }}">Учёт оплаты обучения</a>
    {% if g.user %}
    <nav>
      <a href="{{ url_for('views.students') }}">Студенты</a>
      <a href="{{ url_for('views.new_student') }}">Добавить</a>
      <a href="{{ url_for('views.report') }}">Отчёт</a>
      <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="link">Выйти ({{ g.user['username'] }})</button>
      </form>
    </nav>
    {% endif %}
  </div>
</header>
<main class="wrap">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
